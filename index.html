<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0c766d">
  <title>零用金管理｜V2 測試原型</title>
  <style>
    :root{--ink:#17202d;--muted:#64748b;--teal:#08766d;--bg:#f4f7f7;--card:#fff;--line:#e4eaee;--red:#be2635;--green:#0c8a51;--amber:#b86900;--shadow:0 10px 28px #1232 0}
    *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","Microsoft JhengHei",sans-serif} button,input,select{font:inherit} button{cursor:pointer;border:0}.app{max-width:520px;min-height:100vh;margin:auto;padding-bottom:85px}.top{position:sticky;top:0;z-index:5;background:linear-gradient(125deg,#075a55,#0a877c);color:#fff;padding:18px 20px 16px}.top-row{display:flex;align-items:center;justify-content:space-between}.top h1{font-size:23px;margin:0}.sub{font-size:12px;opacity:.8;margin-top:4px}.company{background:#ffffff22;color:#fff;border:1px solid #ffffff55;border-radius:18px;padding:8px 11px;font-weight:800}.content{padding:16px}.notice{font-size:12px;color:#765700;background:#fff7dc;border:1px solid #f5df94;border-radius:10px;padding:9px 11px;margin-bottom:13px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:17px;margin-bottom:14px;box-shadow:0 4px 16px #18321a0a}.label{font-size:13px;color:var(--muted);font-weight:700}.balance{font-size:38px;font-weight:900;letter-spacing:-1px;margin:5px 0}.formula{font-size:12px;color:var(--muted);line-height:1.6}.section-title{font-weight:900;font-size:20px;margin:4px 0 12px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{border-radius:13px;background:#f5faf9;padding:13px}.stat strong{display:block;font-size:20px;margin-top:4px}.action{width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:16px;margin:0 0 10px;padding:16px;display:flex;align-items:center;gap:13px}.action .ico{height:42px;width:42px;border-radius:12px;display:grid;place-items:center;background:#e3f5f2;color:var(--teal);font-size:22px}.action strong{display:block;font-size:16px}.action small{display:block;color:var(--muted);margin-top:3px}.row{padding:14px 0;border-bottom:1px solid var(--line)}.row:last-child{border:0}.row-top{display:flex;justify-content:space-between;gap:8px}.amount.minus{color:var(--red)}.amount.plus{color:var(--green)}.status{display:inline-block;font-size:12px;font-weight:800;padding:4px 8px;border-radius:10px;background:#fff3dc;color:var(--amber)}.status.ok{background:#e4f7ed;color:var(--green)}.status.diff{background:#fce8eb;color:var(--red)}.muted{color:var(--muted);font-size:13px;margin-top:5px}.primary,.secondary{padding:12px 15px;border-radius:12px;font-weight:900}.primary{color:#fff;background:var(--teal)}.secondary{color:var(--teal);background:#e2f4f1}.tiny{padding:7px 10px;font-size:13px}.nav{position:fixed;z-index:10;bottom:0;left:0;right:0;max-width:520px;margin:auto;background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding:8px 4px calc(8px + env(safe-area-inset-bottom))}.nav button{background:transparent;color:#8290a2;border-radius:12px;padding:6px 1px;font-size:12px;font-weight:800}.nav .active{color:var(--teal);background:#e7f7f4}.nav b{font-size:21px;display:block;line-height:22px}.hidden{display:none!important}.field{display:block;margin:14px 0}.field span{font-size:13px;font-weight:800;display:block;margin-bottom:6px}.field input,.field select{width:100%;border:1px solid #cbd5df;background:#fff;border-radius:11px;padding:12px;font-size:16px}.summary{background:#edf8f6;border-radius:13px;padding:13px;line-height:1.8}.danger{background:#fff1f3;border-radius:12px;padding:12px;color:#90212d;font-weight:700;font-size:14px}.footer-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:18px}.back{background:none;color:var(--teal);font-weight:900;padding:3px 0}.chips{display:flex;gap:8px;overflow:auto;margin-bottom:12px}.chip{white-space:nowrap;padding:8px 10px;border-radius:99px;background:#eef2f5;color:#526174;font-weight:800}.chip.active{background:#dff4ef;color:var(--teal)}.modal{position:fixed;inset:0;background:#0007;z-index:20;display:flex;align-items:end;justify-content:center}.modal-sheet{width:min(520px,100%);background:#fff;border-radius:22px 22px 0 0;padding:22px 20px calc(20px + env(safe-area-inset-bottom))}.company-choice{width:100%;padding:14px;margin:7px 0;border:1px solid var(--line);border-radius:12px;background:#fff;text-align:left;font-weight:800}.company-choice.active{border-color:var(--teal);background:#e6f7f4}.pill{font-size:11px;color:#08766d;background:#e2f5f1;border-radius:8px;padding:3px 6px}.empty{text-align:center;color:var(--muted);padding:30px 8px}
    /* Company safety layer: always show the active company and make switching obvious. */
    .company-banner{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 16px 0;padding:10px 13px;border-radius:0 0 14px 14px;background:#075a55;color:#fff;font-size:13px;font-weight:800;box-shadow:0 4px 12px #1232 0;position:sticky;top:82px;z-index:4}
    .company-banner strong{font-size:16px;letter-spacing:.04em}.company-banner span{font-size:11px;opacity:.85;font-weight:700}.company-banner.company-long{background:#173f86}
    .entry-company-card{margin:12px 0;padding:13px 14px;border-radius:14px;background:#e8f7f4;border:2px solid var(--teal);color:#075a55;font-weight:900}.entry-company-card.company-long{background:#edf2ff;border-color:#2757a8;color:#173f86}.entry-company-card small{display:block;margin-top:4px;font-weight:700;opacity:.8}
    .company-choice{font-size:16px;min-height:64px;display:flex;align-items:center;justify-content:space-between}.company-choice.company-long{border-color:#2757a8;background:#edf2ff}.switch-warning{background:#fff1f3;border:1px solid #f2b5be;border-radius:13px;padding:13px;color:#90212d;font-size:14px;line-height:1.6}.switch-warning button{margin-top:10px}
  </style>
</head>
<body>
<main class="app">
  <header class="top"><div class="top-row"><div><h1>零用金管理</h1><div class="sub">V2 測試原型 · 隔離測試資料，不會寫入正式帳務</div></div><button class="company" id="companyBtn" onclick="window.showCompanies()">全瑩 ▼</button></div></header>
  <button class="company-banner" id="companyBanner" type="button" onclick="window.showCompanies()"><span>目前作業公司：<strong id="companyName">全瑩</strong></span><span>點此切換公司　›</span></button>
  <section class="content" id="view"></section>
  <nav class="nav" aria-label="底部選單"><button data-page="home" class="active" onclick="window.navigate('home')"><b>⌂</b>首頁</button><button data-page="operate" onclick="window.navigate('operate')"><b>＋</b>操作</button><button data-page="records" onclick="window.navigate('records')"><b>☷</b>紀錄</button><button data-page="settings" onclick="window.navigate('settings')"><b>⚙</b>設定</button></nav>
</main>
<div id="modal"></div>
<script>
(() => {
  const state={company:'全瑩',page:'home',filter:'待處理',step:null,advance:{purpose:'',amount:'',person:'Joan'},recordsByCompany:{
    '全瑩':[
      {id:9001,type:'補入零用金',purpose:'8/12 盤點開帳金額',amount:15943,person:'管理者',date:'2026/08/12',status:'已完成',receipt:'—'}
    ],
    '長瑩':[
      {id:9101,type:'補入零用金',purpose:'8/12 盤點開帳金額',amount:2071,person:'管理者',date:'2026/08/12',status:'已完成',receipt:'—'}
    ]
  },auditsByCompany:{'全瑩':[{at:'2026/08/12 盤點',action:'開帳金額',amount:15943,detail:'8/12 實體盤點確認'}],'長瑩':[{at:'2026/08/12 盤點',action:'開帳金額',amount:2071,detail:'8/12 實體盤點確認'}]}};
  const TEST_STORAGE_KEY='pettyCashV2TestOnly';
  const testMode=new URLSearchParams(location.search).get('mode')==='backend'?'backend':'local';
  const backend={status:testMode==='backend'?'loading':'not-used',error:'',recordsByCompany:{},auditsByCompany:{},ledgerByCompany:{},saving:false};
  const testDefaults=JSON.parse(JSON.stringify({recordsByCompany:state.recordsByCompany,auditsByCompany:state.auditsByCompany}));
  try{const stored=JSON.parse(localStorage.getItem(TEST_STORAGE_KEY)||'null');if(stored?.recordsByCompany&&stored?.auditsByCompany){state.recordsByCompany=stored.recordsByCompany;state.auditsByCompany=stored.auditsByCompany}}catch(e){console.warn('無法讀取測試資料，已使用預設假資料。')}
  function persistTestData(){localStorage.setItem(TEST_STORAGE_KEY,JSON.stringify({recordsByCompany:state.recordsByCompany,auditsByCompany:state.auditsByCompany}))}
  Object.defineProperty(state,'records',{get(){return testMode==='backend'?(backend.recordsByCompany[state.company]||[]):state.recordsByCompany[state.company]}});
  Object.defineProperty(state,'audits',{get(){return testMode==='backend'?(backend.auditsByCompany[state.company]||[]):state.auditsByCompany[state.company]}});
  const $=s=>document.querySelector(s); const money=n=>'$'+Number(n||0).toLocaleString('zh-TW'); const MAX_AMOUNT=9999999.99;
  const escapeHtml=value=>String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
  function validAmount(value,{allowZero=false}={}){return Number.isFinite(value)&&value<=MAX_AMOUNT&&(allowZero?value>=0:value>0)}
  function audit(action,amount,detail){state.audits.unshift({at:new Date().toLocaleString('zh-TW',{hour12:false}),action,amount,detail});state.audits.length=Math.min(state.audits.length,500);persistTestData()}
  function sourceNotice(){if(testMode==='local')return '<div class="notice">資料來源：本機測試沙盒（localStorage）。不會呼叫 API 或寫入正式帳務。</div>';if(backend.saving)return '<div class="notice">資料正在儲存至隔離測試帳本，請勿重複點選。</div>';if(backend.status==='loading')return '<div class="notice">資料來源：測試後端；正在讀取隔離測試帳本…</div>';if(backend.status==='ready')return '<div class="notice">資料來源：隔離測試帳本。此站的操作只寫入測試資料，不會寫入正式帳務。</div>';return `<div class="danger">資料來源：測試後端讀取失敗。${backend.error} 未顯示本機假資料，請檢查測試端點設定。</div>`}
  function requireLocalWrite(){if(backend.saving){alert('這筆資料正在儲存，請勿重複點選。');return false}if(testMode==='local'||backend.status==='ready')return true;alert('測試帳本仍在讀取中，請稍後再操作。');return false}
  function backendCompanyId(){return state.company==='全瑩'?'company-a-test':'company-b-test'}
  function backendRequestId(){return 'ui_'+Date.now()+'_'+Math.random().toString(36).slice(2,8)}
  function backendDate(){return new Date().toISOString().slice(0,10)}
  function setSavingControls(saving){document.querySelectorAll('[data-save]').forEach(button=>{if(saving){button.dataset.label=button.textContent;button.textContent='正在儲存…';button.disabled=true}else{button.textContent=button.dataset.label||button.textContent;button.disabled=false}})}
  async function writeTestBackend(action,payload){if(backend.saving)throw new Error('這筆資料正在儲存，請勿重複點選。');const requestId=backendRequestId();backend.saving=true;setSavingControls(true);try{const response=await fetch('/api/test-gas',{method:'POST',headers:{'Content-Type':'application/json',Accept:'application/json'},body:JSON.stringify(Object.assign({action,companyId:backendCompanyId(),actorId:'test-admin',requestId},payload))});const data=await response.json();if(!response.ok||data?.success===false)throw new Error(data?.error?.message||'測試帳本儲存失敗');return data}finally{backend.saving=false;setSavingControls(false)}}
  async function refreshBackend(){backend.status='loading';render();await loadBackendReadOnly()}
  function backendRecord(tx){const typeMap={advance:'預支',direct_expense:'直接支出',replenishment:'補入零用金',adjustment:'調整'};const statusMap={open:'未結清',settled:tx.receiptStatus==='pending'?'待補收據':'已結清',discrepancy_pending:'差異待處理',voided:'已作廢'};const receiptMap={pending:'待補',submitted:'已附',verified:'已附',rejected:'退回',not_required:'—'};return {id:tx.id,revision:Number(tx.revision||0),type:typeMap[tx.transactionType]||tx.transactionType,purpose:tx.purpose||'—',amount:Number(tx.amount||0),person:tx.handlerId||'—',date:String(tx.transactionDate||tx.createdAt||'').slice(0,10).replaceAll('-','/'),status:statusMap[tx.cashStatus]||tx.cashStatus,expense:tx.actualExpense,change:tx.returnedCash,receipt:tx.receiptReference||receiptMap[tx.receiptStatus]||'—'}}
  function backendAudit(event){return {at:String(event.createdAt||'').replace('T',' ').slice(0,19),action:event.action||event.entityType||'稽核事件',amount:Number(event.amount||0),detail:event.reason||event.entityId||'—'}}
  async function loadBackendReadOnly(){try{const id=state.company==='全瑩'?'company-a-test':'company-b-test';const actions=['getHomeData','getRecords','getAudit'];const responses=await Promise.all(actions.map(async action=>{const response=await fetch(`/api/test-gas?action=${action}&companyId=${id}`,{headers:{Accept:'application/json'}});if(!response.ok)throw new Error(`HTTP ${response.status}`);return response.json()}));const [homeData,recordsData,auditData]=responses;if(homeData?.success===false||recordsData?.success===false||auditData?.success===false)throw new Error(homeData?.error?.message||recordsData?.error?.message||auditData?.error?.message||'測試端點回傳失敗');const rawRecords=recordsData?.records?.records||recordsData?.records||[];const rawAudit=auditData?.audit?.audit||auditData?.audit||[];backend.ledgerByCompany[state.company]=Number(homeData?.home?.ledgerCash||0);backend.recordsByCompany[state.company]=Array.isArray(rawRecords)?rawRecords.map(backendRecord):[];backend.auditsByCompany[state.company]=Array.isArray(rawAudit)?rawAudit.map(backendAudit):[];backend.status='ready'}catch(error){backend.status='failed';backend.error=error.message||'無法連線測試端點。'}render()}
  function ledger(){if(testMode==='backend'&&Object.prototype.hasOwnProperty.call(backend.ledgerByCompany,state.company))return backend.ledgerByCompany[state.company]||0;let b=0; state.records.forEach(r=>{if(r.type==='補入零用金')b+=r.amount;if(r.type==='直接支出')b-=r.amount;if(r.type==='預支'){b-=r.amount;if(r.status!=='未結清')b+=Number(r.change||0)}});return b}
  function pending(){return state.records.filter(r=>r.type==='預支'&&['未結清','差異待處理'].includes(r.status))}
  function receiptDue(){return state.records.filter(r=>r.status==='待補收據')}
  function render(){ $('#companyBtn').textContent=state.company+' ▼'; document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===state.page)); const v=$('#view'); if(state.step==='advance') advanceForm(v); else if(state.step&&state.step.startsWith('settle:')) settleForm(v,state.step.slice(7)); else if(state.step==='advanceDone') advanceDone(v); else if(state.step==='direct') directForm(v); else if(state.step==='topup') topupForm(v); else if(state.step==='count') countForm(v); else if(state.step==='audit') auditView(v); else ({home,operate,records,settings})[state.page](v); decorateCompanyUI() }
  function home(v){let p=pending(),r=receiptDue(),readOnly=testMode==='backend'&&backend.status!=='ready';v.innerHTML=`${sourceNotice()}<div class="card"><div class="label">帳面現金</div><div class="balance">${money(ledger())}</div><div class="formula">期初＋補入－直接支出－預支＋已結清找零<br>找零不是收入；盤點不會改寫帳面。</div></div><div class="grid2"><div class="stat"><div class="label">未結清預支</div><strong>${p.length} 筆</strong><div class="muted">${money(p.reduce((a,x)=>a+x.amount,0))}</div></div><div class="stat"><div class="label">待補收據</div><strong>${r.length} 筆</strong><div class="muted">現金已結清亦可待補</div></div></div><div class="card"><div class="section-title">優先處理</div>${p.length?p.map(x=>`<div class="row"><div class="row-top"><strong>${x.purpose}</strong><b class="amount minus">預支 ${money(x.amount)}</b></div><div class="muted">${x.date}｜${x.person}｜<span class="status">未結清</span></div>${readOnly?'':`<div class="footer-actions"><button class="primary tiny" onclick="window.goSettle('${x.id}')">結清這一筆</button></div>`}</div>`).join(''):'<div class="empty">目前沒有未結清預支</div>'}</div><div class="card"><div class="section-title">最近動作</div>${recentRows()}</div>`}
  function operate(v){v.innerHTML=`<div class="section-title">操作</div>${testMode==='backend'?'<div class="notice">此操作會寫入隔離測試帳本，不會寫入正式帳務。</div>':'<p class="muted">選擇真正的現金動作。找零只能在原預支紀錄內結清。</p>'}${action('💵','取款／預支','先拿現金，回來後同筆結清','advance')}${action('🧾','直接支出','沒有預支、直接由零用金支付','direct')}${action('＋','補入零用金','補足現金池，不是找零','topup')}${action('▦','盤點現金','只比對實體現金，不改帳','count')}`}
  function action(i,t,d,s){return `<button class="action" onclick="window.start('${s}')"><span class="ico">${i}</span><span><strong>${t}</strong><small>${d}</small></span></button>`}
  function records(v){let list=state.records.filter(r=>state.filter==='全部'||(state.filter==='待處理'&&['未結清','待補收據','差異待處理'].includes(r.status))||(state.filter==='已處理'&&['已完成','已結清'].includes(r.status))||(state.filter==='盤點'&&r.type==='盤點'));v.innerHTML=`<div class="section-title">紀錄</div><div class="chips">${['待處理','全部','已處理','盤點'].map(x=>`<button class="chip ${state.filter===x?'active':''}" onclick="window.setFilter('${x}')">${x}</button>`).join('')}</div><div class="card">${list.length?list.map(recordRow).join(''):'<div class="empty">沒有符合的紀錄</div>'}</div>`}
  function recordRow(r){let amt=r.type==='補入零用金'?`+ ${money(r.amount)}`:r.type==='盤點'?`差額 ${money(r.amount)}`:r.type==='預支'?`預支 ${money(r.amount)}`:`- ${money(r.amount)}`;let c=r.type==='補入零用金'?'plus':'minus';let detail=r.type==='預支'&&r.status!=='未結清'?`實支 ${money(r.expense)}｜找零 ${money(r.change)}｜收據 ${escapeHtml(r.receipt)}`:`${escapeHtml(r.date)}｜${escapeHtml(r.person)}${r.receipt&&r.receipt!=='—'?`｜收據 ${escapeHtml(r.receipt)}`:''}`;return `<div class="row"><div class="row-top"><strong>${escapeHtml(r.purpose)}</strong><b class="amount ${c}">${amt}</b></div><div class="muted">${escapeHtml(r.type)}｜${detail}</div><div class="muted"><span class="status ${['已完成','已結清'].includes(r.status)?'ok':r.status==='差異待處理'?'diff':''}">${escapeHtml(r.status)}</span></div>${r.type==='預支'&&r.status==='未結清'?'<div class="footer-actions"><button class="secondary tiny" onclick="window.goSettle(\''+r.id+'\')">結清</button></div>':''}</div>`}
  function settings(v){v.innerHTML=`<div class="section-title">設定</div>${sourceNotice()}<div class="card"><div class="label">目前公司</div><strong style="font-size:22px">${state.company}</strong><div class="footer-actions"><button class="secondary tiny" onclick="window.showCompanies()">切換公司</button></div></div><div class="card"><div class="row"><strong>稽核軌跡</strong><div class="muted">每次新增、結清與盤點均留有時間、動作與金額</div><div class="footer-actions"><button class="secondary tiny" onclick="window.openAudit()">查看稽核事件</button></div></div>${testMode==='local'?'<div class="row"><strong>重置測試資料</strong><div class="muted">清除本機測試操作，恢復全瑩與長瑩的預設假資料。</div><div class="footer-actions"><button class="secondary tiny" onclick="window.resetTestData()">重置測試資料</button></div></div>':''}<div class="row"><strong>零用金規則</strong><div class="muted">期初現金、幣別、盤點頻率</div></div><div class="row"><strong>人員與權限</strong><div class="muted">經手人、結清者、管理者</div></div><div class="row"><strong>用途與收據</strong><div class="muted">常用分類、待補收據提醒</div></div><div class="row"><strong>備份與匯出</strong><div class="muted">正式版改版前須先完成備份</div></div></div>`}
  function auditView(v){v.innerHTML=`<button class="back" onclick="window.back()">← 返回設定</button><div class="section-title">稽核軌跡</div><div class="notice">${state.company} 的測試操作紀錄；正式版將改為不可竄改的後端紀錄。</div><div class="card">${state.audits.length?state.audits.map(x=>`<div class="row"><div class="row-top"><strong>${x.action}</strong><b>${money(x.amount)}</b></div><div class="muted">${x.at}｜${x.detail}</div></div>`).join(''):'<div class="empty">尚無稽核事件</div>'}</div>`}
  function advanceForm(v){v.innerHTML=`<button class="back" onclick="window.back()">← 返回操作</button><div class="section-title">取款／預支</div><div class="notice">第 1 步／2：先記預支；回來後再從同一筆填實支與找零。</div>${fields('預支用途','purpose','去郵局','text')}${fields('預支金額','amount','100','number')}${fields('經手人','person','Joan','text')}<div class="footer-actions"><button class="primary" data-save onclick="window.saveAdvance()">確認取款</button></div>`}
  function fields(label,key,placeholder,type){return `<label class="field"><span>${label} *</span><input id="f-${key}" type="${type}" ${type==='number'?'min="0.01" max="9999999.99" step="0.01"':''} placeholder="${placeholder}" value="${escapeHtml(state.advance[key]||'')}"></label>`}
  function advanceDone(v){let x=state.records[0];v.innerHTML=`<div class="card"><div class="section-title">已記錄預支 ✓</div><strong>${x.purpose}｜${money(x.amount)}</strong><div class="muted">${x.person}｜未結清。回來後請從首頁或紀錄的這一筆進行結清。</div><div class="footer-actions"><button class="primary" onclick="window.finishHome()">回首頁</button></div></div>`}
  function settleForm(v,id){let r=state.records.find(x=>String(x.id)===String(id));v.innerHTML=`<button class="back" onclick="window.back()">← 返回</button><div class="section-title">結清預支</div><div class="card"><strong>${r.purpose}｜預支 ${money(r.amount)}</strong><div class="muted">${r.person}｜${r.date}</div></div><div class="notice">第 2 步／2：這會更新原預支紀錄，不會新增找零收入。</div><label class="field"><span>實際支出 *</span><input id="expense" inputmode="decimal" type="number" value="${r.expense??''}"></label><label class="field"><span>找零帶回 *</span><input id="change" inputmode="decimal" type="number" value="${r.change??''}"></label><label class="field"><span>收據狀態 *</span><select id="receipt"><option value="已附">已附</option><option value="待補">待補</option></select></label><label class="field hidden" id="reasonField"><span>差異原因 *</span><input id="reason" placeholder="例如：遺失、追加墊款、輸入有誤"></label><div id="check" class="summary">請輸入實支與找零。</div><div class="footer-actions"><button class="primary" data-save onclick="window.completeSettle('${id}')">完成結清</button></div>`;['expense','change'].forEach(k=>$('#'+k).addEventListener('input',checkSettle))}
  function checkSettle(){let r=state.records.find(x=>String(x.id)===state.step.slice(7));let e=Number($('#expense').value||0),c=Number($('#change').value||0),d=r.amount-e-c,isFlat=d===0;$('#reasonField').classList.toggle('hidden',isFlat);$('#check').innerHTML=`預支 ${money(r.amount)} − 實支 ${money(e)}<br>預計找零 ${money(r.amount-e)}<br><b>差額：${money(d)}</b> ${isFlat?'✓':'（需填差異原因，將列為待處理）'}`}
  async function completeSettle(id){if(!requireLocalWrite())return;let r=state.records.find(x=>String(x.id)===String(id)),expenseValue=$('#expense').value,changeValue=$('#change').value,e=Number(expenseValue),c=Number(changeValue),d=r.amount-e-c;if(expenseValue===''||changeValue===''||!validAmount(e,{allowZero:true})||!validAmount(c,{allowZero:true})){alert('實際支出與找零必須是 0 到 '+money(MAX_AMOUNT)+' 的有效金額。');return}let reason=d===0?'':$('#reason').value.trim();if(d!==0&&!reason){alert('金額不平時，請填寫差異原因。');return}if(testMode==='backend'){try{await writeTestBackend('settleAdvance',{id:String(r.id),revision:r.revision,actualExpense:e,returnedCash:c,receiptStatus:$('#receipt').value==='待補'?'pending':'submitted',reason});state.step=null;state.page='records';await refreshBackend()}catch(error){alert(error.message)}return}r.expense=e;r.change=c;r.receipt=$('#receipt').value;r.exceptionReason=reason;r.status=d!==0?'差異待處理':r.receipt==='待補'?'待補收據':'已完成';audit(d===0?'結清預支':'結清預支（差異待處理）',e,`${r.purpose}｜找零 ${money(c)}${reason?'｜原因：'+reason:''}`);state.step=null;state.page='records';render()}
  function directForm(v){simpleForm(v,'直接支出','沒有預支、直接由零用金付款；請同時標示收據狀態','支出');} function topupForm(v){simpleForm(v,'補入零用金','僅供真正補足現金池；找零請回原預支結清','補入');} function countForm(v){simpleForm(v,'盤點現金','請輸入錢箱內實際現金；差異只會建立待查紀錄，不會自動補帳或沖銷','盤點');}
  function simpleForm(v,title,help,kind){const isCount=kind==='盤點',isExpense=kind==='支出';v.innerHTML=`<button class="back" onclick="window.back()">← 返回操作</button><div class="section-title">${title}</div><div class="notice">${help}</div><label class="field"><span>${isCount?'盤點備註（選填）':'用途／事由 *'}</span><input id="simple-purpose" placeholder="${isCount?'例如：8 月例行盤點':''}"></label><label class="field"><span>${isCount?'實際點收金額':'金額'} *</span><input id="simple-amount" type="number"></label><label class="field"><span>經手人 *</span><input id="simple-person" value="Joan"></label>${isExpense?'<label class="field"><span>收據狀態 *</span><select id="simple-receipt"><option value="已附">已附</option><option value="待補">待補</option></select></label>':''}${isCount?'<div class="danger">帳面現金為 '+money(ledger())+'；差異將只做紀錄，不會自動調整帳面。</div>':''}<div class="footer-actions"><button class="primary" data-save onclick="window.saveSimple('${kind}')">儲存到測試帳本</button></div>`}
  async function saveSimple(kind){if(!requireLocalWrite())return;let p=$('#simple-purpose').value.trim(),a=Number($('#simple-amount').value),person=$('#simple-person').value.trim(),receipt=kind==='支出'?$('#simple-receipt').value:'—';if((kind!=='盤點'&&!p)||!Number.isFinite(a)||!person){alert('請填完必要欄位。');return}if(kind==='盤點'&&!p)p='例行盤點';if(kind==='補入'&&/找零/.test(p)){alert('找零不是補入零用金，請回原預支紀錄結清。');return}if(testMode==='backend'){try{if(kind==='盤點')await writeTestBackend('addCount',{actualCash:a,reason:p});else await writeTestBackend(kind==='支出'?'addDirectExpense':'addReplenishment',{transactionDate:backendDate(),amount:a,purpose:p,handlerId:person,receiptStatus:kind==='支出'?(receipt==='待補'?'pending':'submitted'):'not_required'});state.step=null;state.page='home';await refreshBackend()}catch(error){alert(error.message)}return}let amount=kind==='盤點'?a-ledger():a,status=kind==='盤點'?(a===ledger()?'已完成':'差異待處理'):kind==='支出'&&receipt==='待補'?'待補收據':'已完成',type=kind==='支出'?'直接支出':kind==='補入'?'補入零用金':'盤點';state.records.unshift({id:Date.now(),type,purpose:p,amount,person,date:'2026/08/05',status,receipt});audit(type,amount,`${p}｜${person}${kind==='盤點'?'｜實點 '+money(a):''}`);state.step=null;state.page='home';render()}
  window.saveSimple=saveSimple;window.completeSettle=completeSettle;
  // UI safety layer for the two-company prototype. It decorates every write form
  // after the existing renderer runs, so existing test actions remain unchanged.
  // Keep the original prototype keys (some historical fixtures use encoded labels)
  // while presenting readable company names to users.
  function companyKey(label){const keys=Object.keys(state.recordsByCompany);return label==='長瑩'?(keys[1]||label):(keys[0]||label)}
  function companyLabel(){const keys=Object.keys(state.recordsByCompany);return state.company===keys[1]?'長瑩':'全瑩'}
  function decorateCompanyUI(){
    const name=companyLabel(), banner=$('#companyBanner'), nameEl=$('#companyName');
    if(nameEl) nameEl.textContent=name;
    if(banner) banner.classList.toggle('company-long',name==='長瑩');
    const view=$('#view'); if(!view) return;
    view.querySelectorAll('.entry-company-card').forEach(x=>x.remove());
    if(state.step){
      const card=document.createElement('div'); card.className='entry-company-card'+(name==='長瑩'?' company-long':'');
      card.innerHTML=`這筆會記到：<strong>${name}</strong><small>送出後不能直接改到另一家公司；如要換公司請先返回。</small>`;
      const title=view.querySelector('.section-title'); if(title) title.insertAdjacentElement('afterend',card);
      view.querySelectorAll('.footer-actions .primary').forEach(btn=>{
        if(!btn.dataset.companyLabelled){btn.dataset.companyLabelled='1';btn.textContent=`確認記入${name}｜${btn.textContent}`}
      });
    }
  }
  function draftDirty(){
    if(!state.step) return false;
    return [...document.querySelectorAll('#view input,#view select, #view textarea')].some(x=>String(x.value||'').trim()!=='');
  }
  const originalChooseCompany=window.chooseCompany;
  window.showCompanies=function(){
    const current=companyLabel();
    $('#modal').innerHTML=`<div class="modal"><div class="modal-sheet"><div class="section-title">切換公司</div><div class="muted">目前作業公司：${current}</div><button class="company-choice ${current==='全瑩'?'active':''}" onclick="window.requestCompanySwitch('全瑩')">全瑩生技 <span class="pill">${current==='全瑩'?'目前使用中':'切換到全瑩'}</span></button><button class="company-choice company-long ${current==='長瑩'?'active':''}" onclick="window.requestCompanySwitch('長瑩')">長瑩生技 <span class="pill">${current==='長瑩'?'目前使用中':'切換到長瑩'}</span></button><button class="back" onclick="window.closeModal()">取消</button></div></div>`;
  };
  window.requestCompanySwitch=function(target){
    if(target===companyLabel()){window.closeModal();return}
    if(!draftDirty()){window.chooseCompany(companyKey(target));return}
    const name=companyLabel();
    $('#modal').innerHTML=`<div class="modal"><div class="modal-sheet"><div class="section-title">尚有未儲存資料</div><div class="switch-warning">你有一筆尚未送出的${name}草稿。切換後不能把它自動帶到另一家公司。</div><div class="footer-actions"><button class="secondary" onclick="window.closeModal()">留下草稿</button><button class="primary" onclick="window.discardAndSwitch('${target}')">放棄並切換</button></div></div></div>`;
  };
  window.discardAndSwitch=function(target){state.step=null;window.chooseCompany(companyKey(target))};
  function recentRows(){return state.records.slice(0,3).map(recordRow).join('')}
  window.start=s=>{if(!requireLocalWrite())return;state.step=s;render()};window.back=()=>{state.step=null;render()};window.goSettle=id=>{if(!requireLocalWrite())return;state.step='settle:'+id;render()};window.finishHome=()=>{state.step=null;state.page='home';render()};window.setFilter=f=>{state.filter=f;render()};window.openAudit=()=>{state.step='audit';render()};window.resetTestData=()=>{if(!requireLocalWrite())return;if(!confirm('確定重置所有本機測試資料？這不會影響正式帳務，但會清除本機的測試操作。'))return;state.recordsByCompany=JSON.parse(JSON.stringify(testDefaults.recordsByCompany));state.auditsByCompany=JSON.parse(JSON.stringify(testDefaults.auditsByCompany));localStorage.removeItem(TEST_STORAGE_KEY);state.step=null;render()};window.saveAdvance=async()=>{if(!requireLocalWrite())return;['purpose','amount','person'].forEach(k=>state.advance[k]=$('#f-'+k).value.trim());if(!state.advance.purpose||!Number(state.advance.amount)||!state.advance.person){alert('請填完必要欄位。');return}if(testMode==='backend'){try{await writeTestBackend('addAdvance',{transactionDate:backendDate(),amount:Number(state.advance.amount),purpose:state.advance.purpose,handlerId:state.advance.person,receiptStatus:'not_required'});state.step=null;state.page='home';await refreshBackend()}catch(error){alert(error.message)}return}let r={id:Date.now(),type:'預支',purpose:state.advance.purpose,amount:Number(state.advance.amount),person:state.advance.person,date:'2026/08/05',status:'未結清',expense:null,change:null,receipt:'—'};state.records.unshift(r);audit('新增預支',r.amount,`${r.purpose}｜${r.person}`);state.step='advanceDone';render()};
  function showCompanies(){ $('#modal').innerHTML=`<div class="modal"><div class="modal-sheet"><div class="section-title">切換公司</div><button class="company-choice ${state.company==='全瑩'?'active':''}" onclick="window.chooseCompany('全瑩')">全瑩 <span class="pill">測試資料</span></button><button class="company-choice ${state.company==='長瑩'?'active':''}" onclick="window.chooseCompany('長瑩')">長瑩 <span class="pill">測試資料</span></button><button class="back" onclick="window.closeModal()">取消</button></div></div>`};window.showCompanies=showCompanies;window.chooseCompany=x=>{state.company=x;$('#modal').innerHTML='';if(testMode==='backend'){backend.status='loading';render();loadBackendReadOnly();return}render()};window.closeModal=()=>$('#modal').innerHTML='';window.navigate=page=>{state.page=page;state.step=null;render()};render();if(testMode==='backend')loadBackendReadOnly();
})();
</script>
